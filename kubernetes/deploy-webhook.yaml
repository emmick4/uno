apiVersion: v1
kind: ServiceAccount
metadata:
  name: deploy-webhook
  namespace: uno
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deploy-webhook
  namespace: uno
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deploy-webhook
  namespace: uno
subjects:
  - kind: ServiceAccount
    name: deploy-webhook
    namespace: uno
roleRef:
  kind: Role
  name: deploy-webhook
  apiGroup: rbac.authorization.k8s.io
